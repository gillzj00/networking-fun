name: lab-destroy

on:
  pull_request:
    types: [closed]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  id-token: write

defaults:
  run:
    working-directory: labs/runtime

env:
  TERRAFORM_VERSION: 1.10.5

jobs:
  guard:
    name: gate destroy events
    runs-on: ubuntu-latest
    outputs:
      should_destroy: ${{ steps.decide.outputs.should_destroy }}
      pr_number: ${{ steps.decide.outputs.pr_number }}
    steps:
      - name: decide
        id: decide
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          PR_NUMBER_PR: ${{ github.event.pull_request.number }}
          PR_NUMBER_ISSUE: ${{ github.event.issue.number }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request && 'true' || 'false' }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [[ "$ACTOR" != "gillzj00" ]]; then
            echo "actor=$ACTOR is not the owner; skipping."
            echo "should_destroy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$EVENT_NAME" in
            pull_request)
              echo "should_destroy=true" >> "$GITHUB_OUTPUT"
              echo "pr_number=$PR_NUMBER_PR" >> "$GITHUB_OUTPUT"
              ;;
            issue_comment)
              if [[ "$IS_PR_COMMENT" == "true" ]] && [[ "$COMMENT_BODY" == *"/lab destroy"* ]]; then
                echo "should_destroy=true" >> "$GITHUB_OUTPUT"
                echo "pr_number=$PR_NUMBER_ISSUE" >> "$GITHUB_OUTPUT"
              else
                echo "comment is not a /lab destroy on a PR; skipping."
                echo "should_destroy=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "should_destroy=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  destroy:
    name: terraform destroy
    needs: guard
    if: needs.guard.outputs.should_destroy == 'true'
    runs-on: ubuntu-latest
    environment: lab
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/tf-setup
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-lab-destroy-pr-${{ needs.guard.outputs.pr_number }}

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}" \
            -backend-config="key=labs/${{ needs.guard.outputs.pr_number }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: terraform destroy
        run: |
          # -refresh=false avoids erroring out if AWS state has already drifted (eg. janitor swept it).
          # We pass the same vars used at apply time; values don't matter for destroy but must satisfy validation.
          terraform destroy -auto-approve -no-color -input=false -lock-timeout=5m -refresh=false \
            -var "pr_number=${{ needs.guard.outputs.pr_number }}" \
            -var "lab=hello-fargate" \
            -var "scenario=happy-path" \
            -var "ttl_iso=2099-01-01T00:00:00Z" \
            -var "region=${{ vars.AWS_REGION }}"

  comment:
    name: post destroy comment
    needs: [guard, destroy]
    if: always() && needs.guard.outputs.should_destroy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: render and post comment
        uses: actions/github-script@v7
        env:
          STATUS: ${{ needs.destroy.result == 'success' && 'destroyed' || 'destroy-failed' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_NUMBER: ${{ needs.guard.outputs.pr_number }}
        with:
          script: |
            const script = require('./.github/scripts/render-lab-comment.js');
            await script({github, context, core});
