name: terratest

on:
  pull_request:
    paths:
      - 'labs/**'
      - 'platform/janitor/**'
      - 'platform/budgets.tf'
      - 'tests/**'
      - '.github/workflows/terratest.yml'
  schedule:
    # Nightly at 07:00 UTC = 00:00 PT — quiet hours either coast.
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: terratest-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.22'
  PYTHON_VERSION: '3.12'
  TERRAFORM_VERSION: '1.10.5'

jobs:
  changes:
    name: detect changed paths
    # Cron and manual dispatch always run the full suite; PR runs use the
    # path filter to skip docs-only / unrelated changes.
    runs-on: ubuntu-latest
    outputs:
      janitor: ${{ steps.filter.outputs.janitor || (github.event_name != 'pull_request' && 'true') }}
      vpc: ${{ steps.filter.outputs.vpc || (github.event_name != 'pull_request' && 'true') }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            janitor:
              - 'platform/janitor/**'
              - 'tests/janitor/**'
              - 'tests/go.mod'
              - '.github/workflows/terratest.yml'
            vpc:
              - 'labs/modules/layered-reachability/**'
              - 'tests/vpc/**'
              - 'tests/helpers/**'
              - 'tests/go.mod'
              - '.github/workflows/terratest.yml'

  janitor:
    name: janitor unit test (Python)
    needs: changes
    if: needs.changes.outputs.janitor == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/janitor/requirements-dev.txt

      - name: install deps
        run: pip install --quiet -r tests/janitor/requirements-dev.txt

      - name: pytest
        working-directory: tests/janitor
        run: python -m pytest -v

  vpc:
    name: VPC module integration test (Terratest)
    needs: changes
    if: needs.changes.outputs.vpc == 'true' && (github.event_name != 'pull_request' || github.actor == 'gillzj00')
    runs-on: ubuntu-latest
    environment: lab
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tests/go.sum

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-terratest-${{ github.run_id }}

      - name: go test
        working-directory: tests
        env:
          TERRATEST_STATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: go test ./vpc/... -v -timeout 25m

  summary:
    name: PR comment summary
    needs: [changes, janitor, vpc]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          JANITOR_NEEDED: ${{ needs.changes.outputs.janitor }}
          VPC_NEEDED: ${{ needs.changes.outputs.vpc }}
          JANITOR_RESULT: ${{ needs.janitor.result }}
          VPC_RESULT: ${{ needs.vpc.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- terratest-summary:v1 -->';
            const fmt = (needed, result) => {
              if (needed !== 'true') return 'skipped (no matching paths)';
              if (result === 'success') return 'pass';
              if (result === 'skipped') return 'skipped';
              return `**${result}**`;
            };
            const body = [
              marker,
              '## Terratest summary',
              '',
              `| Test | Status |`,
              `| --- | --- |`,
              `| janitor unit | ${fmt(process.env.JANITOR_NEEDED, process.env.JANITOR_RESULT)} |`,
              `| vpc integration | ${fmt(process.env.VPC_NEEDED, process.env.VPC_RESULT)} |`,
              '',
              `[run details](${process.env.RUN_URL})`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existing = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const prior = existing.find(c => c.body && c.body.startsWith(marker));
            if (prior) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
