name: terratest

on:
  # No top-level paths filter: the workflow must run on every PR so each
  # required check reports a status. The `changes` job below uses
  # dorny/paths-filter to decide which downstream jobs actually execute; the
  # rest are skipped, which GitHub counts as success for required checks.
  pull_request:
  schedule:
    # Nightly at 07:00 UTC = 00:00 PT — quiet hours either coast.
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: terratest-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.22'
  PYTHON_VERSION: '3.12'
  TERRAFORM_VERSION: '1.10.5'
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  changes:
    name: detect changed paths
    # Cron and manual dispatch always run the full suite; PR runs use the
    # path filter to skip docs-only / unrelated changes.
    runs-on: ubuntu-latest
    outputs:
      janitor: ${{ steps.filter.outputs.janitor || (github.event_name != 'pull_request' && 'true') }}
      vpc: ${{ steps.filter.outputs.vpc || (github.event_name != 'pull_request' && 'true') }}
      lab1: ${{ steps.filter.outputs.lab1 || (github.event_name != 'pull_request' && 'true') }}
      lab2: ${{ steps.filter.outputs.lab2 || (github.event_name != 'pull_request' && 'true') }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            janitor:
              - 'platform/janitor/**'
              - 'tests/janitor/**'
              - 'tests/go.mod'
              - '.github/workflows/terratest.yml'
            vpc:
              - 'labs/modules/layered-reachability/**'
              - 'tests/vpc/**'
              - 'tests/helpers/**'
              - 'tests/go.mod'
              - '.github/workflows/terratest.yml'
            lab1:
              - 'labs/modules/layered-reachability/**'
              - 'labs/modules/probe/**'
              - 'tests/lab1/**'
              - 'tests/helpers/**'
              - 'tests/go.mod'
              - '.github/workflows/terratest.yml'
            lab2:
              - 'labs/modules/three-tier-segmentation/**'
              - 'labs/modules/probe/**'
              - 'tests/lab2/**'
              - 'tests/helpers/**'
              - 'tests/go.mod'
              - '.github/workflows/terratest.yml'

  janitor:
    name: janitor unit test (Python)
    needs: changes
    if: needs.changes.outputs.janitor == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/janitor/requirements-dev.txt

      - name: install deps
        run: pip install --quiet -r tests/janitor/requirements-dev.txt

      - name: pytest
        working-directory: tests/janitor
        run: python -m pytest -v

  vpc:
    name: VPC module integration test (Terratest)
    needs: changes
    if: needs.changes.outputs.vpc == 'true' && (github.event_name != 'pull_request' || github.actor == 'gillzj00')
    runs-on: ubuntu-latest
    environment: lab
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/tf-setup
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          setup-go: 'true'
          go-version: ${{ env.GO_VERSION }}
          go-cache-dependency-path: tests/go.sum
          cache-providers: 'true'
          tf-lock-file: tests/vpc/fixtures/.terraform.lock.hcl
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-terratest-${{ github.run_id }}

      - name: go test
        working-directory: tests
        env:
          TERRATEST_STATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: go test ./vpc/... -v -timeout 25m

  scenario:
    name: ${{ matrix.scenario }}
    needs: changes
    if: github.event_name != 'pull_request' || github.actor == 'gillzj00'
    runs-on: ubuntu-latest
    environment: lab
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: lab1-happy-path
            lab: lab1
            package: ./lab1/...
            test: TestLab1HappyPath
            lock: tests/lab1/fixtures/.terraform.lock.hcl
          - scenario: lab1-nacl-deny-egress
            lab: lab1
            package: ./lab1/...
            test: TestLab1NaclDenyEgress
            lock: tests/lab1/fixtures/.terraform.lock.hcl
          - scenario: lab1-missing-vpc-endpoint
            lab: lab1
            package: ./lab1/...
            test: TestLab1MissingVpcEndpoint
            lock: tests/lab1/fixtures/.terraform.lock.hcl
          - scenario: lab1-dns-disabled
            lab: lab1
            package: ./lab1/...
            test: TestLab1DnsDisabled
            lock: tests/lab1/fixtures/.terraform.lock.hcl
          - scenario: lab2-happy-path
            lab: lab2
            package: ./lab2/...
            test: TestLab2HappyPath
            lock: tests/lab2/fixtures/.terraform.lock.hcl
          - scenario: lab2-nacl-stateless-return
            lab: lab2
            package: ./lab2/...
            test: TestLab2NaclStatelessReturn
            lock: tests/lab2/fixtures/.terraform.lock.hcl
    steps:
      - name: decide whether this scenario should run
        id: gate
        # Matrix context isn't available in job-level `if:`, so the per-lab
        # path filter has to gate at the step level. When the relevant lab
        # didn't change, every later step is skipped — the job still shows
        # up as its own check, conclusion=success, matching the
        # "skip == pass for required check" acceptance criterion.
        run: |
          case "${{ matrix.lab }}" in
            lab1) needed='${{ needs.changes.outputs.lab1 }}' ;;
            lab2) needed='${{ needs.changes.outputs.lab2 }}' ;;
            *)    needed='false' ;;
          esac
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "scenario ${{ matrix.scenario }} needed=$needed"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.needed == 'true'

      - uses: ./.github/actions/tf-setup
        if: steps.gate.outputs.needed == 'true'
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          setup-go: 'true'
          go-version: ${{ env.GO_VERSION }}
          go-cache-dependency-path: tests/go.sum
          cache-providers: 'true'
          tf-lock-file: ${{ matrix.lock }}
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-terratest-${{ matrix.scenario }}-${{ github.run_id }}

      - name: go test
        if: steps.gate.outputs.needed == 'true'
        working-directory: tests
        env:
          TERRATEST_STATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: go test ${{ matrix.package }} -v -timeout 30m -run '^${{ matrix.test }}$'

  summary:
    name: PR comment summary
    needs: [changes, janitor, vpc, scenario]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          JANITOR_NEEDED: ${{ needs.changes.outputs.janitor }}
          VPC_NEEDED: ${{ needs.changes.outputs.vpc }}
          LAB1_NEEDED: ${{ needs.changes.outputs.lab1 }}
          LAB2_NEEDED: ${{ needs.changes.outputs.lab2 }}
          JANITOR_RESULT: ${{ needs.janitor.result }}
          VPC_RESULT: ${{ needs.vpc.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- terratest-summary:v2 -->';
            // GitHub does not expose per-matrix-entry results via needs.*, so
            // the summary fetches the run's jobs from the API and maps each
            // matrix entry's job name back to its conclusion.
            const SCENARIOS = [
              { key: 'lab1-happy-path',           lab: 'lab1' },
              { key: 'lab1-nacl-deny-egress',     lab: 'lab1' },
              { key: 'lab1-missing-vpc-endpoint', lab: 'lab1' },
              { key: 'lab1-dns-disabled',         lab: 'lab1' },
              { key: 'lab2-happy-path',           lab: 'lab2' },
              { key: 'lab2-nacl-stateless-return',lab: 'lab2' },
            ];
            const labNeeded = {
              lab1: process.env.LAB1_NEEDED === 'true',
              lab2: process.env.LAB2_NEEDED === 'true',
            };

            const { owner, repo } = context.repo;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: context.runId,
            });
            const jobByName = new Map(jobs.map(j => [j.name, j]));
            // The scenario job sets `name: <matrix.scenario>`, so the
            // GitHub-reported job name is the scenario key verbatim.
            const conclusionFor = (key) => {
              const j = jobByName.get(key);
              if (!j) return 'unknown';
              // Skipped via job-level `if:` shows as conclusion=skipped.
              return j.conclusion || j.status || 'unknown';
            };

            const fmtConclusion = (c) => {
              if (c === 'success') return 'pass';
              if (c === 'skipped') return 'skipped';
              return `**${c}**`;
            };
            const renderScenario = (s) => {
              if (!labNeeded[s.lab]) return 'skipped (no matching paths)';
              return fmtConclusion(conclusionFor(s.key));
            };
            const fmt = (needed, result) => {
              if (needed !== 'true') return 'skipped (no matching paths)';
              return fmtConclusion(result);
            };
            const rows = [
              `| janitor unit | ${fmt(process.env.JANITOR_NEEDED, process.env.JANITOR_RESULT)} |`,
              `| vpc integration | ${fmt(process.env.VPC_NEEDED, process.env.VPC_RESULT)} |`,
              ...SCENARIOS.map(s => `| ${s.key} | ${renderScenario(s)} |`),
            ];
            const body = [
              marker,
              '## Terratest summary',
              '',
              `| Test | Status |`,
              `| --- | --- |`,
              ...rows,
              '',
              `[run details](${process.env.RUN_URL})`,
            ].join('\n');

            const issue_number = context.issue.number;
            const existing = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const prior = existing.find(c => c.body && c.body.startsWith(marker));
            if (prior) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
