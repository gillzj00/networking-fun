name: platform-pipeline

on:
  # No top-level paths filter: the workflow must run on every PR so its
  # required checks report a status. The `changes` job below uses
  # dorny/paths-filter to decide whether the lint/plan/apply jobs actually
  # execute; on PRs that don't touch platform/, those jobs skip cleanly,
  # which GitHub counts as success for required checks.
  pull_request:

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: terraform-apply
  cancel-in-progress: false

defaults:
  run:
    working-directory: platform

env:
  TERRAFORM_VERSION: 1.10.5
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  changes:
    name: detect changed paths
    # Cron and manual dispatch always run the full suite; PR runs use the
    # path filter to skip docs-only / unrelated changes.
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.filter.outputs.platform || (github.event_name != 'pull_request' && 'true') }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            platform:
              - 'platform/**'
              - '.github/workflows/platform-pipeline.yml'
              - '.github/scripts/blast-radius-check.sh'

  lint:
    name: fmt / validate / tflint / checkov
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/tf-setup
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          cache-providers: 'true'
          tf-lock-file: platform/.terraform.lock.hcl

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.55.1

      - name: tflint
        run: |
          tflint --init
          tflint --recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: checkov
        run: |
          pip install --quiet checkov
          checkov --directory . --framework terraform --quiet --compact

  plan:
    name: terraform plan
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    environment: terraform-plan
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/tf-setup
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          cache-providers: 'true'
          tf-lock-file: platform/.terraform.lock.hcl
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-platform-plan-${{ github.run_id }}

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}" \
            -backend-config="key=platform/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: terraform plan
        run: terraform plan -no-color -input=false -lock-timeout=5m -out=tfplan

      - name: terraform show (json)
        run: terraform show -json tfplan > tfplan.json

      - name: blast-radius check
        run: ../.github/scripts/blast-radius-check.sh tfplan.json

      - name: terraform show (text)
        id: planout
        run: |
          terraform show -no-color tfplan > tfplan.txt
          {
            echo 'plan<<TFPLAN_EOF'
            head -c 60000 tfplan.txt
            wc -c < tfplan.txt | awk '{ if ($1 > 60000) print "\n... (truncated, " $1 " bytes total)" }'
            echo 'TFPLAN_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: platform-plan
          message: |
            ### platform/ — `terraform plan`

            <details>
            <summary>Plan output (click to expand)</summary>

            ```hcl
            ${{ steps.planout.outputs.plan }}
            ```
            </details>

            _Blast-radius check: passed. Workflow run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_

      - name: upload tfplan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: |
            platform/tfplan
            platform/.terraform.lock.hcl
          retention-days: 7
          if-no-files-found: error

  apply:
    name: terraform apply
    needs: [changes, lint, plan]
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    environment: terraform-apply
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/tf-setup
        with:
          terraform-version: ${{ env.TERRAFORM_VERSION }}
          cache-providers: 'true'
          tf-lock-file: platform/.terraform.lock.hcl
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-platform-apply-${{ github.run_id }}

      - name: download tfplan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: platform/

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}" \
            -backend-config="key=platform/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: terraform apply
        id: apply
        run: |
          terraform apply -no-color -input=false -lock-timeout=5m tfplan 2>&1 | tee tfapply.txt

      - name: capture apply output
        if: always()
        id: applyout
        run: |
          if [ ! -f tfapply.txt ]; then touch tfapply.txt; fi
          {
            echo 'apply<<TFAPPLY_EOF'
            head -c 60000 tfapply.txt
            wc -c < tfapply.txt | awk '{ if ($1 > 60000) print "\n... (truncated, " $1 " bytes total)" }'
            echo 'TFAPPLY_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: marocchino/sticky-pull-request-comment@v2
        if: always()
        with:
          header: platform-apply
          message: |
            ### platform/ — `terraform apply`

            **Status:** ${{ job.status }}

            <details>
            <summary>Apply output (click to expand)</summary>

            ```hcl
            ${{ steps.applyout.outputs.apply }}
            ```
            </details>

            _Workflow run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_
